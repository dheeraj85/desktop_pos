<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KOT + Invoice</title>

<style>
@media print {
  @page { size: 80mm auto; margin: 0; }
  body { margin: 0; padding: 0; }
}

* {
  color: #000 !important;
  background: transparent !important;
}

body {
  font-family: monospace;
  font-size: 12px;              /* 🔥 PHOTO JAISE */
  width: 72mm;
  padding: 4px;
  box-sizing: border-box;
}

.company-title {
  font-size: 15px;
  font-weight: 800;
}


.center { text-align: center; font-weight: bold; }
.left   { text-align: left; }
.right  { text-align: right; }
.small  { font-size: 11px; }

hr {
  border: none;
  border-top: 1px dashed #000;
  margin: 5px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 3px 0;
  font-size: 12px;
}

th {
  border-bottom: 1px dashed #000;
}

td.item { width: 33mm; }
td.qty  { width: 12mm; text-align: right; white-space: pre; }

td.amt  { width: 14mm; text-align: right; white-space: pre; padding-left: 1mm; }

.page-break {
  page-break-after: always;
}

.spacer {
  height: 8mm;
}
</style>
</head>

<body>
<div id="print-root"></div>

<script>
const { ipcRenderer } = require("electron");
const fs   = require("fs");
const path = require("path");

function fmtRate(n) {
   return Math.round(+n || 0);   
}

function fmtQty(item) {
  let q = String(item.qty ?? "").trim();

  // 🔥 handle ".100" → "0.100"
  if (q.startsWith(".")) {
    q = "0" + q;
  }

  // 🔥 ensure 3 decimals if decimal exists
  if (q.includes(".")) {
    const num = parseFloat(q);
    if (!isNaN(num)) {
      return num.toFixed(3);   // "0.100"
    }
  }

  // normal integer
  return q === "" ? "0" : q;
}


function fmtAmt(n) {
  return Math.round(+n || 0);   
}

function pad(val, len){
  return String(val).padStart(len, " ");
}
function fmt(n){ return (+n || 0).toFixed(2); }
//function pad(val, len){ return String(val).padStart(len, " "); }


/* ===== READ company.json ===== */
let company = {};
try {
  const p = path.join(__dirname, "data", "company.json");
  const json = JSON.parse(fs.readFileSync(p, "utf8"));
  company = Array.isArray(json) ? json[0] : json;
} catch (e) {}

ipcRenderer.on("invoice-data", (e, sale) => {

  const root = document.getElementById("print-root");
  const dateStr = new Date().toLocaleString("en-IN");
  const tokenNo = sale.id;
  const KotNo = String(sale.id).replace(/[^\d]/g, "");


  /* ================= KOT ================= */
  let html = `
    <div>
      <div class="center company-title">KOT - ${company.company_name}</div>
      <div class="small">Date: ${dateStr}</div>
<div class="small">Token: #${KotNo}</div>
      <hr>

      <table>
        <tr>
          <th class="left">Item</th>
          <th class="right">Qty</th>
        </tr>
  `;

  sale.items.forEach(i => {
    html += `
      <tr>
        <td class="item">${i.name}</td>
        <td class="qty">${pad(fmtQty(i), 6)}</td>
      </tr>
    `;
  });

  html += `
      </table>
      <div class="spacer"></div>
    </div>

    <div class="page-break"></div>

    <!-- ================= INVOICE ================= -->
    <div>
<div class="center company-title">${company.company_name}</div>
      <div class="center small">${company.company_address}</div>
      <div class="center small">${company.contact_number}</div>
      <div class="center small">GSTIN: ${company.company_gstin || "N/A"}</div>
      <hr>

      <div class="small">Date: ${dateStr}</div>
      <div class="small">Invoice: ${tokenNo}</div>
      <hr>

      <table>
        <tr>
          <th class="left"  style="width:33mm">Item</th>
          <th class="right" style="width:7mm">Qty</th>
     
          <th class="right" style="width:14mm">Amt</th>
        </tr>
  `;

  let total = 0;
  let gstPercent = 0;
  let gstValue = 0;

  sale.items.forEach(i => {
 const qtyNum = parseFloat(i.qty) || 0;   // for math only
const rate   = parseFloat(i.price) || 0;
const gst    = +i.gst_percent || 0;
    const qty = +i.qty || 0;
const amt    = qtyNum * rate;

   
    const base = rate / (1 + gst/100);

    total += amt;
    gstValue += (rate - base) * qty;
    gstPercent = gst;
const scale = i.item_scale || "";   // e.g. kg / gm / pcs

html += `
  <tr>
    <td class="item">
      ${i.name}<br>
      (GST${gst}% Rate ₹${fmtRate(rate)})
    </td>
   <td class="qty">
  ${pad(fmtQty(i), 6)}<br>${scale}
</td>
<td class="amt">${pad(fmtAmt(amt), 8)}</td>
  </tr>
`;

  });

  html += `
      </table>

      <hr>
      <div class="right"><b>Total: ₹${fmtAmt(total)}</b></div>
      <div class="center small">Payment Mode: ${sale.paymentMode || "Cash"}</div>

     

      <hr>
        <div class="center small">Rates are inclusive of all taxes
          </div>
      <div class="center">Thank You! Visit Again 🙏</div>
      <div class="spacer"></div>
    </div>
  `;

  root.innerHTML = html;
});
</script>
</body>
</html>
